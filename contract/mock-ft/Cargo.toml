[package]
name = "mock-ft"
description = "Minimal NEP-141 mock token (test only) for the escrow sandbox tests"
version = "0.1.0"
edition = "2024"
resolver = "3"
rust-version = "1.93"
repository = "https://github.com/example/private-escrow"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.29"
near-contract-standards = "5.29"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(near)']
